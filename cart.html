<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <!--Box icon-->
      <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        body{
            font-family: montserrat;
            background:#E8F9FF;
        }
        .wrapper{
            max-width: 1000px;
            margin: 0 auto;
        }
        .wrapper h1{
            padding: 30px 0;
            text-align: center;
            text-transform: uppercase;
        }
        .project{
            display: flex;

        }
        .shop{
            flex: 75%;
        }
        .box{
            display: flex;
            width: 100%;
            height: 200px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #fff;
            transition: all .6s ease;
            box-shadow: rgba(100,100,111,0.2) 0 7px 29px 0;
        }
        .box:hover{
            transform: scale(1.02);
        }
        .box img{
            width: auto;
            height: 200px;
            object-fit: cover;
        }
        .content{
            padding: 20px;
            position: relative
            ;
            width: 100%;
        }
        .content h3{
            margin-bottom: 30px;
        }
        .content h4{
            margin-bottom: 50px;
        }
        .btn-area{
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 10px 25px;
            background-color: #3a71a9;
            color: #fff;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
        }
        .btn-area:hover{
            background-color: #76bfb6;
            color: #fff;
        }
        .unit input{
            width: 50px;
            padding: 8px;
            text-align: center;
        }
        .btn-area i{
            margin-right: 5px;
        }
        .right-bar{
            flex: 25%;
            margin-left: 20px;
            padding: 20px;
            height: 400px;
            border-radius: 5px;
            background: #fff;
            box-shadow: rgba(100,100,111,0.2) 0 7px 29px 0;


        }
        .right-bar hr{
            margin-bottom: 25px;
        }
        .right-bar p{
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            font-size: 20px;
        }
        .right-bar a{
            background-color: #76bfb6;
            color: #fff;
            text-decoration: none;
            display: block;
            text-align: center;
            height: 40px;
            line-height: 40px;
            font-weight: 900;
        }
        .right-bar i{
            margin-right: 15px;
        }
        .right-bar a:hover{
            background-color: #397ca7;
        }
        @media screen and (max-width:700px) {
            .content h3{
                margin-bottom: 15px;
            }
            .content h4{
                margin-bottom: 20px;
            }
            .btn2{
                display: none;
            }
            .box{
                height: 150px;
            }
            .box img{
                height: 150px;
                width: 200px;
            }
        }
        @media screen and (max-width:900px) {
            .project{
                flex-direction: column;
            }
            .right-bar{
                margin-left: 0;
                margin-bottom: 20px;
            }
        }
        @media screen and (max-width:1250px) {
            .wrapper{
                max-width: 95%;
            }
        }
    </style>

</head>
<body>
    <div class="wrapper">
        <h1>Shopping Cart</h1>
        <div class="project">
            <div class="shop">
                <div class="box">
                    <img src="img/cart/dior-mini-cd-mini-cd-o-r4i-4100-54-16-pink.jpg" alt="">
                    <div class="content">
                        <h3>Dior Glasses</h3>
                        <h4>Price: 40$</h4>
                        <p class="unit">Quantity : <input value="2"></p>
                        <p class="btn-area">
                            <i class='bx bxs-trash'></i>
                            <span class="btn2">Remove</span>
                        </p>
                    </div>
                </div>
                <div class="box">
                    <img src="img/cart/bolon.jpg" alt="">
                    <div class="content">
                        <h3>Bolon Glasses</h3>
                        <h4>Price: 100$</h4>
                        <p class="unit">Quantity : <input value="1"></p>
                        <p class="btn-area">
                            <i class='bx bxs-trash'></i>
                            <span class="btn2">Remove</span>
                        </p>
                    </div>
                </div>
                <div class="box">
                    <img src="img/cart/rayban.jpg" alt="">
                    <div class="content">
                        <h3>RayBan</h3>
                        <h4>Price: 90$</h4>
                        <p class="unit">Quantity : <input value="3"></p>
                        <p class="btn-area">
                            <i class='bx bxs-trash'></i>
                            <span class="btn2">Remove</span>
                        </p>
                    </div>
                </div>
            </div>
            <div class="right-bar">
                <p><span>Subtotal</span><span>500$</span></p>
                <hr>
                <p><span>Tax (5%)</span> <span>6$</span></p>
                <hr>
                <p><span>Shipping</span> <span>10$</span></p>
                <hr>
                <p><span>Total</span> <span>516$</span></p>

                <a href="#"><i class='bx bx-cart' >Check Out</i></a>
            </div>
        </div>
    </div>
</body>
</html>
